name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill frontmatter, references, and scripts
        run: scripts/check.sh
      - name: Lint shell scripts
        run: |
          shellcheck -x scripts/*.sh scripts/lib/*.sh tests/*.sh tests/behavior/*.sh \
            tests/behavior/lib/*.sh tests/behavior/scenarios/*/setup.sh \
            tests/behavior/scenarios/*/check.sh skills/*/scripts/*.sh
      - name: Run the shell tests
        run: tests/run.sh
      - name: Reject trailing whitespace
        run: |
          if grep -rnE ' +$' --include='*.md' --include='*.sh' --include='*.yml' . --exclude-dir=.git; then
            echo "trailing whitespace found" >&2
            exit 1
          fi
